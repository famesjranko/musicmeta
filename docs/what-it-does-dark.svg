<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker></defs>

  <rect x="1" y="26" width="182" height="44" rx="8" fill="none" stroke="#3d444d"/>
  <text x="92" y="54" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">"Radiohead"</text>
  <line x1="187" y1="48" x2="215" y2="48" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="224" y="8" width="714" height="80" rx="9" fill="none" stroke="#6ea8fe" stroke-width="1.75"/>
  <text x="242" y="30" font-size="12.5" font-weight="600" fill="#6ea8fe">EnrichmentEngine</text>
  <text x="920" y="30" font-size="11.5" text-anchor="end" fill="#9198a1">11 upstream APIs &#183; 36 metadata types</text>
  <g font-size="13" fill="#e6edf3" text-anchor="middle">
    <rect x="248" y="42" width="118" height="32" rx="6" fill="none" stroke="#9198a1"/><text x="307" y="63">identity</text>
    <rect x="392" y="42" width="118" height="32" rx="6" fill="none" stroke="#9198a1"/><text x="451" y="63">fan-out</text>
    <rect x="536" y="42" width="118" height="32" rx="6" fill="none" stroke="#9198a1"/><text x="595" y="63">merge</text>
    <rect x="680" y="42" width="118" height="32" rx="6" fill="none" stroke="#9198a1"/><text x="739" y="63">cache</text>
  </g>
  <g stroke="#9198a1" stroke-width="1.25" marker-end="url(#ar)">
    <line x1="366" y1="58" x2="386" y2="58"/><line x1="510" y1="58" x2="530" y2="58"/><line x1="654" y1="58" x2="674" y2="58"/>
  </g>
  <text x="868" y="63" text-anchor="middle" font-size="11.5" fill="#9198a1">gated per result,</text>
  <text x="868" y="77" text-anchor="middle" font-size="11.5" fill="#9198a1">as each one lands</text>

  <line x1="470" y1="92" x2="470" y2="122" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="1" y="128" width="937" height="196" rx="9" fill="none" stroke="#56d4a0" stroke-width="1.75"/>
  <text x="20" y="154" font-size="13" font-weight="600" fill="#56d4a0">ArtistProfile</text>
  <text x="122" y="154" font-size="11.5" fill="#9198a1">&#183; AlbumProfile and TrackProfile share the shape</text>
  <line x1="20" y1="164" x2="918" y2="164" stroke="#3d444d"/>
  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#e6edf3">
    <text x="20" y="188">photo</text><text x="20" y="212">bio</text><text x="20" y="236">genres</text>
    <text x="20" y="260">discography</text><text x="20" y="284">similarArtists</text>
    <text x="20" y="310" font-size="11.5" fill="#9198a1">results[type]</text>
  </g>
  <g font-size="12.5" fill="#9198a1">
    <text x="210" y="188">wikidata, +4 alternates</text>
    <text x="210" y="212">wikipedia</text>
    <text x="210" y="236">alternative rock (1.00), rock (1.00)</text>
    <text x="210" y="260">45 releases</text>
    <text x="210" y="284">31 artists, last.fm + deezer merged</text>
    <text x="210" y="310" font-size="11.5">every type's own outcome &#8212; tells "no data" from "could not fetch"</text>
  </g>
  <g font-size="12" fill="#9198a1" text-anchor="end">
    <text x="918" y="188">95%</text><text x="918" y="212">95%</text><text x="918" y="236">100%</text>
    <text x="918" y="260">60%</text><text x="918" y="284">80%</text>
  </g>
</svg>
