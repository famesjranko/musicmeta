  <line x1="20" y1="300" x2="918" y2="300" stroke="#3d444d"/>
  <text x="20" y="322" font-size="12" fill="#9198a1">AlbumProfile adds art, back and booklet scans, tracklists, credits, editions, label and release data.</text>
  <text x="20" y="340" font-size="12" fill="#9198a1">TrackProfile adds synced and plain lyrics, previews, similar tracks. 36 types in all &#8212; ask for one, or every one.</text>
