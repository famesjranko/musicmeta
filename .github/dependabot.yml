version: 2
updates:
  # Keeps the SHA-pinned actions in the release workflows current, which is what makes pinning
  # maintainable. No target-branch: with one permanent branch, the default is the only answer.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Gradle resolves a version conflict by taking the highest version in the graph, so what we
  # declare is a floor, not a pin. A stale floor is overridden by any consumer who wants newer and
  # costs them nothing. A fresh floor is imposed on every consumer who does not — an app on OkHttp 4
  # that takes musicmeta-okhttp is dragged to whatever we publish, and `okhttp` is `api`, so that
  # lands on their compile classpath. Raising what we publish is the change that can break someone;
  # leaving it alone is not. So the dependencies a consumer inherits move for a reason — a security
  # advisory, or an API we need — never because a version number went up.
  #
  # Everything not ignored below is our own build and test tooling. It reaches no consumer, and a
  # bad bump fails loudly in our own build, so it arrives as one grouped PR a month. Two members
  # need more than a green run before merging, and both are documented where they live rather than
  # pinned here: `detekt` (VERIFICATION.md — built against a different Kotlin/AGP than this repo
  # runs, so all three modules' typed tasks have to be re-run) and `ktlint-gradle`
  # (libs.versions.toml — the CLI version is set explicitly, so a plugin bump must not be read as a
  # rule-set bump).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      build-tooling:
        patterns:
          - "*"

    # Each entry is a wildcard over the whole coordinate rather than the one artifact that reaches
    # a consumer, because libs.versions.toml shares a single version ref across each family:
    # `okhttp` covers mockwebserver, `room` covers room-testing, `coroutines` covers
    # kotlinx-coroutines-test. Ignoring only the published artifact would let its test-only sibling
    # drag the shared ref up and publish the bump anyway.
    #
    # `version-update:*` suppresses version updates only. A security advisory still opens a PR, and
    # a security PR is exempt from the open-PR limit — which is the whole reason this list is safe.
    ignore:
      - dependency-name: "com.squareup.okhttp3:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "androidx.room:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "org.json:json"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
