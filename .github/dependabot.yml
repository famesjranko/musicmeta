version: 2
updates:
  # Keeps the SHA-pinned actions in the release workflows current, which is what makes pinning
  # maintainable. No target-branch: with one permanent branch, the default is the only answer.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Every dependency here reaches a consumer: core's three are transitive on the published POM,
  # and the adapters exist to bring OkHttp and Room. A stale one is imposed on everyone who takes
  # the library, and nothing else in the repo notices — `apiCheck` does not read the POM, and no
  # gate reads versions at all.
  #
  # Grouped so a quiet week is one PR rather than a dozen. Two bumps need more than a green run
  # before merging, and both are documented where they live rather than pinned here:
  # `detekt` (VERIFICATION.md — 1.23.8 is built against a different Kotlin/AGP than this repo runs,
  # so all three modules' typed tasks have to be re-run) and `ktlint-gradle` (libs.versions.toml —
  # the CLI version is set explicitly, so a plugin bump must not be read as a rule-set bump).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # Only minors and patches share a PR. A major falls outside the group and arrives alone,
      # because a grouped major is reviewed as whichever of its siblings breaks first, and a
      # Gradle, AGP or Room major each needs its own migration argument before a green run
      # means anything.
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
