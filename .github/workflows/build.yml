name: Build

on:
  # No base filter: stacked PRs (based on another PR's branch) must get CI too.
  pull_request:
  push:
    branches:
      - main
  # Manual recovery valve for a dropped/undelivered pull_request webhook.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install pinned tooling
        # Same pinned versions developers get, so CI and local cannot disagree about what a rule
        # means. ./check refuses to run rather than silently skipping a layer whose tool is absent.
        run: |
          ./scripts/bootstrap.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the check command
        # The same command developers and agents run locally. CI having its own step list is what
        # makes a CI failure a guessing game, so there is deliberately only one thing to run here.
        # --skip-demo only because demo-canary below is a separate required check; running it here
        # too would compile demo-cli/ twice. Local `./check` still covers everything.
        run: ./check --skip-demo

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # `demo-cli/` is a separate composite build, so `./gradlew build` never compiles it — this is the only
  # in-tree consumer compiling like an external one. Not a parameter-position guard; see CLAUDE.md.
  #
  # This is the only place CI compiles demo-cli/ — the build job passes --skip-demo so it is not done
  # twice. The job stays separate rather than folding into `build` because `demo-canary` is a
  # required status check in the `main` protection ruleset and reports under its own name; deleting
  # it would block merges to `main` waiting for a check that no longer runs.
  demo-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile and test demo-cli composite build
        # demo-cli/ has no wrapper of its own — it borrows the root one via ../gradlew. No test
        # sources yet; the test task reports NO-SOURCE and passes rather than failing.
        working-directory: demo-cli
        run: ../gradlew compileKotlin test

      - name: Compile and test demo-web composite build
        # Same shape as demo-cli/: a separate composite build nothing else compiles.
        working-directory: demo-web
        run: ../gradlew compileKotlin test
