name: Provider availability trend

# Weekly measurement of how often each keyless provider endpoint fails, and how. An UNAVAILABLE
# leaves no trace: the schema pin reports one on the day and forgets it, so a provider degrading
# steadily looks identical to one that is fine. This is the instrument that keeps the trace.
#
# Never gating — see CHANGELOG 0.10.0 (#16). It makes live third-party calls, so it cannot decide
# whether this repo's code is correct. A red run here is a measurement to read, not a merge to stop.
#
# **Why this job may write to the repository.** `main`'s ruleset (`main protection`) includes
# exactly `refs/heads/main` and excludes nothing, and it carries a `pull_request` rule with no
# bypass actors, so `GITHUB_TOKEN` cannot push to `main` under any permission. A branch that is not
# `main` is outside the ruleset entirely. So the series lives on its own branch, written by this
# job and read by anyone who fetches it — no pull request per run, and `main` untouched.
#
# The probe holds **no provider secrets at all**: it measures only the eight keyless endpoints,
# because putting a key in a URL puts it in the output. That is what makes `contents: write` here
# cheap — it is repository write on a job with no third-party credentials in scope. If a keyed
# provider is ever added to the probe, this job must split into a keyed measuring job and an
# unkeyed writing job, or go back to artifacts.
#
# **A second vantage point is a second series.** These rows are a GitHub runner's egress as much as
# the upstream's availability. They are not comparable with the laptop rows in
# `scripts/probes/provider-availability-counts.csv` on `main`, and are deliberately kept in a
# different file on a different branch so that no reader and no parser can mix them.
#
# **Why the counts branch and not an artifact.** ~90 rows a week is ~4.7k a year: diffable,
# permanent, greppable, and the history outlives any retention policy. Artifact retention is 30
# days by default, which at weekly cadence holds four samples — not a trend, and it would make a
# retention setting load-bearing for a signal defined in months.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Weekly because 180 third-party requests is not a thing to do every
    # morning, and the detection arithmetic does not need it. An hour after the daily drift watch
    # rather than alongside it, so the two are never measuring through the same runner contention.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Never pull_request_target, and never a fork-triggered event: this job can write to the
# repository. schedule + workflow_dispatch only, both of which require write access already.
permissions:
  contents: write

concurrency:
  group: provider-availability-trend
  # Not cancel-in-progress: two runs pushing the same branch is what serialising prevents, and
  # cancelling one mid-push would lose a measurement that has already cost 180 live requests.
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # The series, and the branch it lives on. The branch holds this one file and nothing else, so
      # it can never be mistaken for a stale fork of `main` or merged into it by accident.
      COUNTS_BRANCH: availability-counts
      COUNTS_FILE: scripts/probes/provider-availability-counts-runner.csv
      # Matches the laptop series' round count. The threshold arithmetic is stated per `ROUNDS`, so
      # a series measured at a different round count cannot reuse a rule derived at 20.
      ROUNDS: 20

    steps:
      # SHA-pinned, not tag-pinned: a tag is mutable, and this job holds repository write.
      # Bumping means updating the digest — the action's commit SHA, not the tag-object SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not the default shallow clone: this job pushes a commit, and pushing from a shallow
          # repository depends on what the remote already has. A full clone of a repository this
          # size costs seconds and removes the question.
          fetch-depth: 0

      - name: Read the series so far
        # The branch may not exist on the first run, and a first run must not be a failed run.
        # `git show` of the branch's blob rather than a checkout: the probe and the check must come
        # from this workflow's own commit, not from whatever the counts branch happens to carry.
        run: |
          set -eo pipefail
          git fetch --no-tags origin "+refs/heads/${COUNTS_BRANCH}:refs/remotes/origin/${COUNTS_BRANCH}" || true
          if git rev-parse -q --verify "refs/remotes/origin/${COUNTS_BRANCH}" >/dev/null; then
            git show "origin/${COUNTS_BRANCH}:${COUNTS_FILE}" > "${COUNTS_FILE}"
            echo "::notice::Read $(( $(wc -l < "${COUNTS_FILE}") - 1 )) rows from ${COUNTS_BRANCH}."
          else
            rm -f "${COUNTS_FILE}"
            echo "::notice::${COUNTS_BRANCH} does not exist yet; this run starts the series."
          fi

      - name: Measure
        # No retry. Shedding is per-request, not per-run, so a second whole-run attempt buys nothing
        # and costs another 180 requests of live traffic; the per-kind counts are what separate a
        # shed from a degradation now.
        run: ./scripts/probes/provider-transient-probe.sh

      - name: Commit the row
        # Before the check, deliberately, and mirroring the probe's own ordering: a run that
        # measured 180 requests and then failed its reading must not lose the measurement. The
        # commit is built with plumbing so the branch holds exactly this one file — a checkout of
        # `main` followed by a commit would carry the whole tree onto the counts branch forever.
        # Pushed without --force: a lost update is a loud non-fast-forward, not a silent gap.
        run: |
          set -eo pipefail
          blob="$(git hash-object -w "${COUNTS_FILE}")"
          # A scratch index, not `git mktree`: mktree builds one flat tree and rejects a path with
          # a slash in it. This also leaves the checkout's own index untouched.
          export GIT_INDEX_FILE="${RUNNER_TEMP}/counts.index"
          rm -f "${GIT_INDEX_FILE}"
          git update-index --add --cacheinfo "100644,${blob},${COUNTS_FILE}"
          tree="$(git write-tree)"
          message="availability counts for run ${GITHUB_RUN_ID}"
          if parent="$(git rev-parse -q --verify "refs/remotes/origin/${COUNTS_BRANCH}")"; then
            commit="$(git commit-tree "${tree}" -p "${parent}" -m "${message}")"
          else
            commit="$(git commit-tree "${tree}" -m "${message}")"
          fi
          git push origin "${commit}:refs/heads/${COUNTS_BRANCH}"
        env:
          # commit-tree will not guess an identity on a runner, and the identity is the job.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Read the trend
        # `--collect-only`, and it must stay that way until this series has a baseline of its own.
        # The threshold the laptop series uses — 3 failures in 20 — was derived from a 4.4% baseline
        # measured on a laptop on one day. This runner's baseline does not exist, and applying that
        # number here would alert on a GitHub egress rate nobody has measured.
        #
        # **To retire it**, once the check reports that the series is long enough: for each provider
        # take its failures over its total across the collected runs, and read the healthy baseline
        # off the providers that never stepped. Then pick the smallest `failures in total` whose
        # per-run false-alarm rate against that baseline is acceptable when required on two
        # consecutive runs, the way the laptop threshold was picked at `ROUNDS=20`. Drop
        # `--collect-only` and pass the pair as `--threshold-failures` and `--threshold-total`. Do
        # not carry the laptop numbers over: they measure a different network.
        #
        # A malformed or unreadable file still fails this step in collect-only mode. A trend watch
        # that reads nothing must never look healthy.
        run: |
          python3 scripts/checks/check_availability_trend.py \
            --counts-file "${COUNTS_FILE}" \
            --collect-only
