<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>musicmeta-core demo</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #7c9cff;
    --ok: #4fd18b;
    --warn: #e0b34c;
    --err: #f06868;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1.75rem 1.5rem 0.9rem;
    max-width: 920px;
    margin: 0 auto;
  }
  header h1 {
    margin: 0;
    font-size: 1.3rem;
    letter-spacing: -0.01em;
  }
  header h1 span { color: var(--accent); }
  header p {
    margin: 0.3rem 0 0;
    color: var(--muted);
    font-size: 0.86rem;
  }
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 0.85rem;
    margin: 1rem 0 0.6rem;
  }
  select, input[type="text"] {
    background: #0f1115;
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.5rem 0.65rem;
    font-size: 0.88rem;
  }
  input[type="text"] { flex: 1; min-width: 160px; }
  button {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 1.05rem;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--muted); font-size: 0.84rem; min-height: 1.2em; margin-bottom: 0.4rem; }
  #status.err { color: var(--err); }
  #examples { color: var(--muted); font-size: 0.8rem; margin: 0 0 1.1rem; }
  #examples button {
    background: none; color: var(--accent); padding: 0; margin-right: 0.9rem;
    font-weight: 500; font-size: 0.8rem; text-decoration: underline; text-underline-offset: 2px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.85rem;
  }
  .summary { display: flex; gap: 1rem; }
  .summary img {
    width: 96px; height: 96px; object-fit: cover; border-radius: 10px;
    background: #0f1115; flex: none;
  }
  .summary .body { min-width: 0; flex: 1; }
  .summary .titlerow { display: flex; align-items: baseline; gap: 0.55rem; flex-wrap: wrap; }
  .summary h2 { margin: 0; font-size: 1.15rem; }
  .summary .subtitle { color: var(--accent); font-size: 0.84rem; margin: 0.15rem 0 0.45rem; }
  .summary .text {
    color: #c7cbd4; font-size: 0.85rem; line-height: 1.5;
    max-height: 5.4em; overflow: hidden;
  }
  .summary .source { color: var(--muted); font-size: 0.74rem; margin-top: 0.35rem; }

  .sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0.85rem; }
  .section h3 {
    margin: 0 0 0.5rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted); display: flex; justify-content: space-between;
  }
  .section h3 .count { color: #5c6478; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .section ul { list-style: none; margin: 0; padding: 0; }
  .section li {
    display: flex; gap: 0.5rem; align-items: center;
    padding: 0.35rem 0; border-top: 1px solid var(--panel-border); font-size: 0.83rem;
  }
  .section li:first-child { border-top: none; }
  .section li.item-hidden { display: none; }
  .section li img { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex: none; }
  .section li .primary { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .section li .primary a { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .section li .primary a:hover { color: var(--accent); border-color: var(--accent); }
  .section li .secondary { color: var(--muted); font-size: 0.78rem; }
  .section li .meta {
    color: var(--muted); font-size: 0.72rem; background: #0f1115;
    border-radius: 5px; padding: 0.1rem 0.4rem; flex: none;
  }
  .show-more {
    background: none; color: var(--accent); padding: 0.4rem 0 0; margin: 0; font-size: 0.78rem;
    font-weight: 500; text-align: left; width: 100%;
  }

  .preview-btn {
    flex: none; width: 22px; height: 22px; border-radius: 50%; padding: 0;
    background: #262b36; color: var(--text); font-size: 0.65rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-btn:hover { background: var(--accent); color: #0f1115; }
  .preview-btn.playing { background: var(--ok); color: #0f1115; }
  .preview-btn.loading { opacity: 0.6; }
  .summary .preview-btn { width: 30px; height: 30px; font-size: 0.8rem; }

  details.meta-panel { margin-top: 0.1rem; }
  details.meta-panel summary {
    cursor: pointer; color: var(--muted); font-size: 0.8rem; outline: none;
  }
  table.providers { width: 100%; border-collapse: collapse; margin-top: 0.6rem; font-size: 0.78rem; }
  table.providers th, table.providers td {
    text-align: left; padding: 0.28rem 0.5rem; border-top: 1px solid var(--panel-border);
  }
  table.providers th { color: var(--muted); font-weight: 500; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.4rem; }
  .dot.ok { background: var(--ok); }
  .dot.not_found { background: var(--muted); }
  .dot.rate_limited { background: var(--warn); }
  .dot.error { background: var(--err); }

  #empty { color: var(--muted); font-size: 0.88rem; padding: 2rem 0; text-align: center; }
  .loading-panel {
    display: flex; align-items: center; justify-content: center; gap: 0.7rem;
    color: var(--muted); font-size: 0.9rem; padding: 2.5rem 0;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 2px solid var(--panel-border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  button .spinner { border-color: rgba(15,17,21,0.35); border-top-color: #0f1115; margin-right: 0.4rem; }
  #submit { display: inline-flex; align-items: center; }
  footer { color: var(--muted); font-size: 0.74rem; text-align: center; padding: 1.6rem 0 0; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <h1>music<span>meta</span>-core demo</h1>
    <p>Live calls into the published library — enriches from up to 11 real music-metadata providers and merges the results.</p>
  </header>
  <main>
    <form id="query-form">
      <select id="kind">
        <option value="artist">Artist</option>
        <option value="album">Album</option>
        <option value="track">Track</option>
      </select>
      <input id="name" type="text" placeholder="Artist name (e.g. Radiohead)" autocomplete="off" />
      <input id="artist" type="text" placeholder="Artist (for album / track)" autocomplete="off" style="display:none" />
      <input id="album" type="text" placeholder="Album (optional, helps track matching)" autocomplete="off" style="display:none" />
      <button id="submit" type="submit">Enrich</button>
    </form>
    <div id="examples">
      Try:
      <button type="button" data-kind="artist" data-name="Radiohead">Radiohead</button>
      <button type="button" data-kind="album" data-name="OK Computer" data-artist="Radiohead">OK Computer</button>
      <button type="button" data-kind="track" data-name="Karma Police" data-artist="Radiohead" data-album="OK Computer">Karma Police</button>
    </div>
    <div id="status"></div>
    <div id="result"><div id="empty">Enter a name above and hit Enrich.</div></div>
    <footer>
      Backed by a local instance of <code>musicmeta-core</code> — see <a href="https://github.com/famesjranko/musicmeta" target="_blank" rel="noopener">github.com/famesjranko/musicmeta</a>.
    </footer>
  </main>

<script>
const kindEl = document.getElementById('kind');
const nameEl = document.getElementById('name');
const artistEl = document.getElementById('artist');
const albumEl = document.getElementById('album');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const submitBtn = document.getElementById('submit');
const MAX_VISIBLE = 8;

const NAME_PLACEHOLDERS = {
  artist: 'Artist name (e.g. Radiohead)',
  album: 'Album title (e.g. OK Computer)',
  track: 'Track title (e.g. Karma Police)',
};

function syncArtistField() {
  artistEl.style.display = kindEl.value === 'artist' ? 'none' : '';
  artistEl.placeholder = kindEl.value === 'album' ? 'Artist (required)' : 'Artist (for track)';
  albumEl.style.display = kindEl.value === 'track' ? '' : 'none';
  nameEl.placeholder = NAME_PLACEHOLDERS[kindEl.value] || NAME_PLACEHOLDERS.artist;
}
kindEl.addEventListener('change', syncArtistField);
syncArtistField();

document.getElementById('examples').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-kind]');
  if (!btn) return;
  kindEl.value = btn.dataset.kind;
  nameEl.value = btn.dataset.name;
  artistEl.value = btn.dataset.artist || '';
  albumEl.value = btn.dataset.album || '';
  syncArtistField();
  runQuery();
});

document.getElementById('query-form').addEventListener('submit', (e) => {
  e.preventDefault();
  runQuery();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

async function runQuery() {
  const kind = kindEl.value;
  const name = nameEl.value.trim();
  const artist = artistEl.value.trim();
  const album = albumEl.value.trim();
  if (!name || (kind !== 'artist' && !artist)) {
    statusEl.textContent = kind === 'artist' ? 'Enter a name.' : 'Enter both a name and an artist.';
    statusEl.className = 'err';
    return;
  }

  stopPreview();
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Enriching…';
  statusEl.className = '';
  statusEl.textContent = '';
  resultEl.innerHTML = '<div class="loading-panel"><span class="spinner"></span>Calling providers — this can take a few seconds…</div>';

  const params = new URLSearchParams({ kind, name, artist, album });
  try {
    const res = await fetch('/api/enrich?' + params.toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    render(data);
  } catch (err) {
    statusEl.className = 'err';
    statusEl.textContent = 'Failed: ' + err.message;
    resultEl.innerHTML = '<div id="empty">No result.</div>';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enrich';
  }
}

// --- Rendering ---

function render(data) {
  const summary = data.summary;
  const img = summary.imageUrl
    ? `<img src="${esc(summary.imageUrl)}" alt="" onerror="this.remove()" />`
    : '';
  const text = summary.text
    ? `<div class="text">${esc(summary.text)}</div>${summary.textSource ? `<div class="source">source: ${esc(summary.textSource)}</div>` : ''}`
    : '';
  const summaryPreview = previewButtonHtml(summary.previewTitle, summary.previewArtist, summary.previewAlbum);

  const sections = data.sections.map(sectionHtml).join('');
  const totalItems = data.sections.reduce((n, s) => n + s.items.length, 0);

  const providers = data.meta.providers.map((p) => `
    <tr>
      <td><span class="dot ${esc(p.status.split(':')[0])}"></span>${esc(p.type)}</td>
      <td>${esc(p.provider)}</td>
      <td>${esc(p.status)}</td>
      <td>${p.confidence != null ? p.confidence.toFixed(2) : '—'}</td>
    </tr>`).join('');

  resultEl.innerHTML = `
    <div class="card summary">
      ${img}
      <div class="body">
        <div class="titlerow"><h2>${esc(summary.title)}</h2>${summaryPreview}</div>
        ${summary.subtitle ? `<div class="subtitle">${esc(summary.subtitle)}</div>` : ''}
        ${text}
      </div>
    </div>
    <div class="sections">${sections}</div>
    <div class="card">
      <details class="meta-panel">
        <summary>${data.meta.elapsedMs}ms · ${totalItems} items across ${data.sections.length} sections${data.meta.identityMatch ? ' · identity: ' + esc(data.meta.identityMatch) : ''} — how we got this</summary>
        <table class="providers">
          <thead><tr><th>Type</th><th>Provider</th><th>Status</th><th>Confidence</th></tr></thead>
          <tbody>${providers}</tbody>
        </table>
      </details>
    </div>
  `;
}

function sectionHtml(section) {
  const items = section.items.map((it, i) => {
    const hidden = i >= MAX_VISIBLE ? ' item-hidden' : '';
    const primaryHtml = it.link
      ? `<a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.primary)}</a>`
      : esc(it.primary);
    const preview = previewButtonHtml(it.previewTitle, it.previewArtist, it.previewAlbum);
    return `
      <li class="${hidden.trim()}">
        ${it.imageUrl ? `<img src="${esc(it.imageUrl)}" alt="" onerror="this.remove()" />` : ''}
        <span class="primary">${primaryHtml}${it.secondary ? ` <span class="secondary">${esc(it.secondary)}</span>` : ''}</span>
        ${it.meta ? `<span class="meta">${esc(it.meta)}</span>` : ''}
        ${preview}
      </li>`;
  }).join('');
  const toggle = section.items.length > MAX_VISIBLE
    ? `<button type="button" class="show-more" data-remaining="${section.items.length - MAX_VISIBLE}">Show all ${section.items.length}</button>`
    : '';
  return `<div class="card section"><h3>${esc(section.label)} <span class="count">${section.items.length}</span></h3><ul>${items}</ul>${toggle}</div>`;
}

function previewButtonHtml(title, artist, album) {
  if (!title || !artist) return '';
  return `<button type="button" class="preview-btn" data-title="${esc(title)}" data-artist="${esc(artist)}" data-album="${esc(album || '')}" title="Play 30s preview">&#9654;</button>`;
}

// --- Show more / show fewer (event delegation, no extra network calls) ---

resultEl.addEventListener('click', (e) => {
  const toggle = e.target.closest('.show-more');
  if (toggle) {
    const card = toggle.closest('.section');
    const hidden = card.querySelectorAll('li.item-hidden');
    const expanding = hidden.length > 0;
    if (expanding) {
      hidden.forEach((li) => li.classList.remove('item-hidden'));
      toggle.textContent = 'Show fewer';
    } else {
      card.querySelectorAll('li').forEach((li, i) => { if (i >= MAX_VISIBLE) li.classList.add('item-hidden'); });
      toggle.textContent = 'Show all ' + card.querySelectorAll('li').length;
      card.scrollIntoView({ block: 'nearest' });
    }
  }
});

// --- 30s preview playback ---

const audio = new Audio();
let activeBtn = null;

audio.addEventListener('ended', stopPreview);

function stopPreview() {
  audio.pause();
  if (activeBtn) activeBtn.classList.remove('playing', 'loading');
  activeBtn = null;
}

resultEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('.preview-btn');
  if (!btn) return;

  if (btn === activeBtn) {
    stopPreview();
    return;
  }
  stopPreview();
  activeBtn = btn;
  btn.classList.add('loading');

  const params = new URLSearchParams({
    title: btn.dataset.title,
    artist: btn.dataset.artist,
    album: btn.dataset.album || '',
  });
  try {
    const res = await fetch('/api/preview?' + params.toString());
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No preview');
    if (btn !== activeBtn) return; // superseded by another click while loading
    audio.src = data.url;
    await audio.play();
    btn.classList.remove('loading');
    btn.classList.add('playing');
  } catch (err) {
    if (btn === activeBtn) {
      btn.classList.remove('loading');
      btn.title = 'No preview available';
      activeBtn = null;
    }
  }
});
</script>
</body>
</html>
