[versions]
# SDK
compileSdk = "35"
# No API-level-specific code — 21 is the practical floor (Google Play Services minimum)
minSdk = "21"

# Core
agp = "9.3.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

# Hilt
hilt = "2.54"
hilt-navigation-compose = "1.2.0"

# Room
room = "2.6.1"

# WorkManager
work = "2.10.0"

# Lifecycle (viewModelScope) — the docs-samples-android ViewModel snippet only, musicmeta-android
# itself has no lifecycle dependency
lifecycle = "2.8.7"

# Serialization
kotlinx-serialization = "1.7.3"

# Coroutines
coroutines = "1.9.0"

# OkHttp
okhttp = "4.12.0"

# Maven Central Publishing
vanniktech-publish = "0.30.0"

# Public API compatibility (ABI baselines under each module's api/ directory)
binary-compatibility-validator = "0.18.1"

# Formatting and style. Not stock: `.editorconfig` selects the `intellij_idea` code style over
# ktlint's own default and disables the wrapping rules, each with its reasoning next to it.
ktlint-gradle = "14.2.0"

# The ktlint the plugin runs, pinned rather than left to the plugin's default. Three things read
# this number: `build.gradle.kts` sets the gate to it, `scripts/format-on-write.sh` refuses to
# format unless the CLI on PATH matches, and `scripts/bootstrap.sh` installs it — so bumping here
# also requires that script's `KTLINT_SHA256`, which fails the download until you do.
# Bumping it is a rule-set change — expect new violations, and read the ktlint release notes first.
ktlint-cli = "1.8.0"

# Static analysis — the linter layer ktlint does not cover (complexity, bug patterns, dead code)
detekt = "1.23.8"

# Testing
junit = "4.13.2"
turbine = "1.2.0"
robolectric = "4.13"
androidx-test-core = "1.6.1"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"

[libraries]
# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# WorkManager
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-navigation-compose" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-navigation-compose" }

# Lifecycle
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# OkHttp
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# JSON parsing
json = { module = "org.json:json", version = "20231013" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[bundles]
room = [
    "room-runtime",
    "room-ktx",
]
testing = [
    "junit",
    "kotlinx-coroutines-test",
    "turbine",
]

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
